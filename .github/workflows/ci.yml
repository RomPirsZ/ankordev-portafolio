name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fijadas por SHA de commit (una etiqueta se puede mover); Dependabot las actualiza
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # La misma versión que Workers Builds (lee .node-version) y engines
          node-version-file: .node-version
          cache: npm
      # .npmrc: sin scripts de instalación y solo desde el registro de npm
      - run: npm ci
      - run: npx astro check
      - run: npx vitest run
      # Site key de prueba de Cloudflare (pública, siempre pasa); la real solo vive en Workers Builds
      - run: npx astro build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - run: npm audit --audit-level=high
