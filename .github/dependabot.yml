version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Espera 7 días tras cada publicación, como min-release-age en .npmrc (las
    # actualizaciones de seguridad no esperan)
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      testing:
        patterns: ['vitest', '@playwright/test', '@axe-core/*']
    ignore:
      # Un salto mayor de Astro o del adaptador requiere decisión explícita
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrojs/vercel'
        update-types: ['version-update:semver-major']
      # @astrojs/check 0.9.x solo admite TypeScript ^5 || ^6; quitar al soportar 7
      - dependency-name: 'typescript'
        versions: ['>=7']
      # @shadergradient/react 2.4.x usa el chunk cube_uv_reflection_fragment, que three
      # quitó en 0.187.0; quitar cuando ShaderGradient lo soporte (plan §6.1)
      - dependency-name: 'three'
        versions: ['>=0.187.0']
      - dependency-name: '@types/three'
        versions: ['>=0.187.0']
      # Va ligado a la versión de Node en uso (engines: 26.x)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  # Actions de la CI, fijadas por SHA en ci.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
