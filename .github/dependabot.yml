version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      testing:
        patterns: ['vitest', '@playwright/test', '@axe-core/*']
    ignore:
      # Un salto mayor de Astro o del adaptador requiere decisión explícita
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrojs/vercel'
        update-types: ['version-update:semver-major']
      # @astrojs/check 0.9.x solo admite TypeScript ^5 || ^6; quitar al soportar 7
      - dependency-name: 'typescript'
        versions: ['>=7']
      # Va ligado a la versión de Node en uso (engines: 26.x)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
